<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#14C4B0">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="description" content="A random zhuzh to open a stand-up or close a wrap-up.">
<title>Zhuzh</title>
<style>
  :root {
    --accent: #5B3DF5;      /* electric violet */
    --accent-dark: #4227D6;
    --ink: #0E3F4A;         /* deep teal, for text */
    --bg: #14C4B0;          /* bright teal */
    --paper: #FFFFFF;
    --muted: #5C7A80;
    --cell: clamp(9rem, 26vw, 15rem);
    --q-size: clamp(1.5rem, 4.4vw, 3.25rem);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
  }

  body {
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding:
      calc(1rem + env(safe-area-inset-top))
      calc(1rem + env(safe-area-inset-right))
      calc(1rem + env(safe-area-inset-bottom))
      calc(1rem + env(safe-area-inset-left));
    background: var(--bg);
    color: var(--ink);
    font-family: Aptos, "Segoe UI", system-ui, -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  .card {
    position: relative;
    width: min(56rem, 100%);
    background: var(--paper);
    border-radius: 8px;
    padding: clamp(1.5rem, 4vw, 3rem);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(1rem, 2.5vw, 1.75rem);
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .number {
    font-size: clamp(1.125rem, 2.2vw, 1.5rem);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.04em;
    color: var(--accent);
  }

  .window {
    width: 100%;
    height: var(--cell);
    overflow: hidden;
    position: relative;
  }

  .strip {
    position: absolute;
    inset: 0 0 auto 0;
    display: flex;
    flex-direction: column;
  }

  .strip.rolling { will-change: transform, filter; }

  .cell {
    height: var(--cell);
    flex: 0 0 var(--cell);
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    font-size: var(--q-size);
    line-height: 1.15;
    font-weight: 600;
    text-wrap: balance;
    padding: 0 0.25rem;
  }

  .settled .cell {
    user-select: text;
    -webkit-user-select: text;
  }

  button {
    font: inherit;
    font-weight: 600;
    font-size: clamp(1rem, 1.6vw, 1.125rem);
    color: var(--paper);
    background: var(--accent);
    border: 0;
    border-radius: 4px;
    min-height: 44px;
    min-width: 44px;
    padding: 0.75rem 1.75rem;
    cursor: pointer;
    touch-action: manipulation;
  }

  button:disabled { opacity: 0.55; cursor: default; }

  button:focus-visible {
    outline: 3px solid var(--ink);
    outline-offset: 3px;
  }

  @media (hover: hover) {
    button:not(:disabled):hover { background: var(--accent-dark); }
  }

  .info {
    position: absolute;
    top: clamp(0.75rem, 2vw, 1.25rem);
    right: clamp(0.75rem, 2vw, 1.25rem);
    width: 2rem;
    height: 2rem;
    min-width: 0;
    min-height: 0;
    padding: 0;
    border-radius: 50%;
    background: transparent;
    color: var(--accent);
    border: 2px solid var(--accent);
    font-size: 1rem;
    font-weight: 700;
    font-style: italic;
    line-height: 1;
    display: grid;
    place-items: center;
  }

  /* The visible dot is 2rem, but the tap target extends to 44px. */
  .info::before {
    content: "";
    position: absolute;
    inset: -6px;
    border-radius: 50%;
  }

  @media (hover: hover) {
    .info:hover { background: var(--accent); color: var(--paper); }
  }

  .info[aria-expanded="true"] {
    background: var(--accent);
    color: var(--paper);
  }

  .info-panel {
    position: absolute;
    top: calc(clamp(0.75rem, 2vw, 1.25rem) + 2.5rem);
    right: clamp(0.75rem, 2vw, 1.25rem);
    left: clamp(0.75rem, 2vw, 1.25rem);
    max-width: 26rem;
    margin-left: auto;
    z-index: 2;
    background: var(--ink);
    color: var(--paper);
    border-radius: 8px;
    padding: 1rem 1.125rem;
    font-size: 0.9375rem;
    line-height: 1.45;
    text-align: left;
    cursor: default;
    user-select: text;
    -webkit-user-select: text;
  }

  .info-panel[hidden] { display: none; }

  .info-panel p { margin: 0; }

  .hint {
    font-size: 0.8125rem;
    color: var(--muted);
    margin: 0;
  }

  @media (max-width: 30rem) {
    .hint { display: none; }
  }

  .visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    clip-path: inset(50%);
    white-space: nowrap;
  }
</style>
</head>
<body>

<main class="card" id="card">
  <button class="info" id="info" type="button" aria-expanded="false" aria-controls="info-panel" aria-label="What is a zhuzh?">i</button>
  <div class="info-panel" id="info-panel" role="dialog" aria-label="What is a zhuzh?" hidden>
    <p>A zhuzh lifts the mood and breaks up the work: one short, slightly odd question, asked round the room. It works at a wrap-up, at the top of a stand-up, as an icebreaker, or any time a session needs air in it.</p>
  </div>
  <div class="number" id="number" aria-hidden="true">#000</div>
  <div class="window" id="window">
    <div class="strip settled" id="strip"></div>
  </div>
  <button id="again" type="button">Another one</button>
  <p class="hint">Tap the card or press space for another</p>
  <p class="visually-hidden" role="status" aria-live="polite" id="live"></p>
</main>

const strip = document.getElementById("strip");
const numberEl = document.getElementById("number");
const button = document.getElementById("again");
const card = document.getElementById("card");
const live = document.getElementById("live");

const DECOYS = 12;
const DURATION = 1100;
const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)");

let current = -1;
let rolling = false;
// Bumped whenever the number lands, so a stale counter loop can't paint over it.
let countToken = 0;

const pad = n => String(n).padStart(3, "0");
const cellHeight = () => document.getElementById("window").getBoundingClientRect().height;

function makeCell(text) {
  const el = document.createElement("div");
  el.className = "cell";
  el.textContent = text;
  return el;
}

function pickTarget() {
  let i = Math.floor(Math.random() * ZHUZHES.length);
  if (i === current) i = Math.floor(Math.random() * ZHUZHES.length);
  return i;
}

function settle(index) {
  countToken++;
  strip.replaceChildren(makeCell(ZHUZHES[index]));
  strip.style.transform = "translateY(0)";
  strip.style.filter = "none";
  strip.classList.remove("rolling");
  strip.classList.add("settled");
  numberEl.textContent = "#" + pad(index + 1);
  live.textContent = "Zhuzh " + (index + 1) + ". " + ZHUZHES[index];
  current = index;
  rolling = false;
  button.disabled = false;
}

function countTo(target, duration) {
  const start = performance.now();
  const from = current >= 0 ? current + 1 : 0;
  const to = target + 1;
  const token = countToken;

  function frame(now) {
    // settle() has already written the final number — stop, don't overwrite it.
    if (token !== countToken) return;
    const t = Math.min((now - start) / duration, 1);
    // Same deceleration shape as the strip, so digits land with the text.
    const eased = 1 - Math.pow(1 - t, 3);
    if (t < 1) {
      // Jitter mid-count so it reads as a spinning odometer, not a smooth ramp.
      const value = Math.round(from + (to - from) * eased);
      const jitter = t < 0.85 ? Math.floor(Math.random() * 40) - 20 : 0;
      const shown = Math.min(Math.max(value + jitter, 1), ZHUZHES.length);
      numberEl.textContent = "#" + pad(shown);
      requestAnimationFrame(frame);
    } else {
      numberEl.textContent = "#" + pad(to);
    }
  }
  requestAnimationFrame(frame);
}

function roll() {
  if (rolling) return;
  const target = pickTarget();

  if (reduceMotion.matches) {
    settle(target);
    strip.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 150, easing: "ease-out" });
    return;
  }

  rolling = true;
  button.disabled = true;

  const cells = [];
  for (let i = 0; i < DECOYS; i++) {
    cells.push(makeCell(ZHUZHES[Math.floor(Math.random() * ZHUZHES.length)]));
  }
  cells.push(makeCell(ZHUZHES[target]));

  strip.classList.remove("settled");
  strip.classList.add("rolling");
  strip.replaceChildren(...cells);

  const distance = DECOYS * cellHeight();

  const animation = strip.animate(
    [
      { transform: "translateY(0)", filter: "blur(6px)" },
      { transform: `translateY(-${distance + cellHeight() * 0.06}px)`, filter: "blur(0.4px)", offset: 0.88 },
      { transform: `translateY(-${distance}px)`, filter: "blur(0px)" }
    ],
    { duration: DURATION, easing: "cubic-bezier(0.15, 0.85, 0.2, 1)", fill: "forwards" }
  );

  countTo(target, DURATION);

  animation.finished.then(() => {
    animation.cancel();
    settle(target);
  }).catch(() => {
    settle(target);
  });
}

const info = document.getElementById("info");
const infoPanel = document.getElementById("info-panel");

function setInfo(open) {
  infoPanel.hidden = !open;
  info.setAttribute("aria-expanded", String(open));
}

info.addEventListener("click", event => {
  event.stopPropagation();
  setInfo(infoPanel.hidden);
});

// Let people select the text in the panel without re-rolling behind it.
infoPanel.addEventListener("click", event => event.stopPropagation());

button.addEventListener("click", event => {
  event.stopPropagation();
  roll();
});

card.addEventListener("click", () => {
  // A tap outside the open panel dismisses it rather than rolling.
  if (!infoPanel.hidden) {
    setInfo(false);
    return;
  }
  roll();
});

document.addEventListener("keydown", event => {
  if (event.key === "Escape") {
    setInfo(false);
    return;
  }
  if (event.code === "Space" || event.key === " ") {
    // Let a focused button handle its own activation.
    if (event.target.closest && event.target.closest("button")) return;
    event.preventDefault();
    if (!event.repeat) roll();
  }
});

roll();
</script>

</body>
</html>
